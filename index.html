<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f97316">
    <title>Stock Rinde Dos</title>
    
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW no registrado:', err));
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans selection:bg-orange-200">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNwNcdzSxuL3q4C8_rL8CAEp3ypEuH-k4",
            authDomain: "rindedos-7f352.firebaseapp.com",
            projectId: "rindedos-7f352",
            storageBucket: "rindedos-7f352.firebasestorage.app",
            messagingSenderId: "417789919326",
            appId: "1:417789919326:web:1b9e89d3626c5e0c5774cf"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            window.firebaseDB = db;
            window.doc = doc;
            window.setDoc = setDoc;
            window.getDoc = getDoc;
            window.onSnapshot = onSnapshot;
            window.firebaseConfig = firebaseConfig;
        } catch (e) {
            console.error("Error al inicializar Firebase:", e);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Íconos SVG puros
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
        const Home = (p) => <Icon {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
        const PlusCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></Icon>;
        const MinusCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></Icon>;
        const BarChart3 = (p) => <Icon {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></Icon>;
        const Edit2 = (p) => <Icon {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></Icon>;
        const Save = (p) => <Icon {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>;
        const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const Store = (p) => <Icon {...p}><path d="m2 7 4.38-4.38A2 2 0 0 1 7.8 2h8.4a2 2 0 0 1 1.41.59L22 7"/><path d="M2 12h20"/><path d="M3 12v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8"/><path d="M10 22V14h4v8"/></Icon>;
        const Settings = (p) => <Icon {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
        const Plus = (p) => <Icon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
        const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>;
        const AlertTriangle = (p) => <Icon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></Icon>;

        function App() {
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            
            const doc = window.doc;
            const setDoc = window.setDoc;
            const getDoc = window.getDoc;
            const onSnapshot = window.onSnapshot;

            useEffect(() => {
                const check = setInterval(() => {
                    if (window.firebaseDB) {
                        setIsFirebaseReady(true);
                        clearInterval(check);
                    }
                }, 100);
                return () => clearInterval(check);
            }, []);

            const mesSistemaReal = new Date().toISOString().slice(0, 7);
            const appId = "rindedos-app";

            const [listaSucursales, setListaSucursales] = useState(['Diarco', 'Maxiconsumo']);
            const [sucursal, setSucursal] = useState('');
            const [appIniciada, setAppIniciada] = useState(false); 
            const [agregandoSucursal, setAgregandoSucursal] = useState(false);
            const [nuevaSucursal, setNuevaSucursal] = useState('');
            const [tabActual, setTabActual] = useState('inicio');
            
            // Nuevo: Sistema de meses
            const [mesSeleccionado, setMesSeleccionado] = useState(mesSistemaReal);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const [datosStock, setDatosStock] = useState({ gondola: {}, deposito: {} });
            const [saboresActivos, setSaboresActivos] = useState([]);
            
            const [editandoStock, setEditandoStock] = useState(null);
            const [valGondola, setValGondola] = useState({ grandes: "", chicas: "" });
            const [valDeposito, setValDeposito] = useState({ grandes: "" });

            const [saborSeleccionado, setSaborSeleccionado] = useState('');
            const [ubicacionSel, setUbicacionSel] = useState('gondola');
            const [cantGondola, setCantGondola] = useState({ grandes: '', chicas: '' });
            const [cantDeposito, setCantDeposito] = useState({ grandes: '' });

            const [mostrarAjustes, setMostrarAjustes] = useState(false);
            const [nuevoSabor, setNuevoSabor] = useState('');
            const [editandoSaborInfo, setEditandoSaborInfo] = useState(null);
            const [nombreEditado, setNombreEditado] = useState('');

            // 1. GENERAR LISTA DE MESES DISPONIBLES (Desde Septiembre 2026 hasta hoy)
            const generarMeses = () => {
                const meses = [];
                let fechaActual = new Date('2026-09-01T00:00:00');
                const fechaFin = new Date();
                fechaFin.setDate(1); // Evita saltos raros a fin de mes

                while (fechaActual <= fechaFin) {
                    meses.push(fechaActual.toISOString().slice(0, 7));
                    fechaActual.setMonth(fechaActual.getMonth() + 1);
                }
                return meses.reverse(); // El más nuevo primero
            };

            const formatearMes = (mesString) => {
                const [y, m] = mesString.split('-');
                const d = new Date(y, parseInt(m) - 1, 1);
                return d.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).replace(/^\w/, c => c.toUpperCase());
            };

            // 2. LÓGICA DE HERENCIA DE STOCK (Copiar mes pasado si el nuevo está vacío)
            useEffect(() => {
                if (!window.firebaseDB || !sucursal || !appIniciada) return;
                const db = window.firebaseDB;

                const heredarStock = async () => {
                    const docRefActual = doc(db, 'artifacts', appId, 'public', 'data', sucursal, mesSistemaReal);
                    const snapActual = await getDoc(docRefActual);
                    
                    // Si ya existe el mes actual, no hacemos nada (ya heredó o ya se cargó)
                    if (snapActual.exists()) return;

                    // Si no existe, buscamos hacia atrás hasta 6 meses para heredar
                    let currentSearch = mesSistemaReal;
                    for (let i = 0; i < 6; i++) {
                        let [y, m] = currentSearch.split('-');
                        let prevDate = new Date(y, parseInt(m) - 2, 1);
                        let prevMes = prevDate.toISOString().slice(0, 7);
                        
                        const docRefPrev = doc(db, 'artifacts', appId, 'public', 'data', sucursal, prevMes);
                        const snapPrev = await getDoc(docRefPrev);
                        
                        if (snapPrev.exists()) {
                            // Encontramos el último mes registrado. Lo copiamos al mes actual.
                            await setDoc(docRefActual, snapPrev.data());
                            console.log(`Stock heredado de ${prevMes} a ${mesSistemaReal}`);
                            break;
                        }
                        currentSearch = prevMes;
                    }
                };
                
                heredarStock();
            }, [sucursal, appIniciada]);

            // 3. OBTENER DATOS (Escuchando el mes seleccionado)
            useEffect(() => {
                if (!window.firebaseDB) return;
                const db = window.firebaseDB;

                // Sucursales
                const sucursalesRef = doc(db, 'artifacts', appId, 'public', 'config_sucursales');
                const unsubSuc = onSnapshot(sucursalesRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().lista) setListaSucursales(docSnap.data().lista);
                });

                if (!sucursal || !appIniciada) return () => unsubSuc();

                // Datos de Stock del mes seleccionado
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', sucursal, mesSeleccionado);
                const unsubStock = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setDatosStock({ gondola: data.gondola || {}, deposito: data.deposito || {} });
                    } else {
                        setDatosStock({ gondola: {}, deposito: {} });
                    }
                });

                // Sabores
                const configRef = doc(db, 'artifacts', appId, 'public', `config_sabores`);
                const unsubConfig = onSnapshot(configRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().lista) {
                        setSaboresActivos(docSnap.data().lista.sort((a,b) => a.localeCompare(b)));
                    } else {
                        const listaPorDefecto = [
                            "Ananá", "Durazno", "Frutilla", "Limón", "Limón 1+1", 
                            "Manzana", "Manzana 1+1", "Mix Frutal", "Naranja", 
                            "Naranja 1+1", "Naranja Banana", "Naranja Durazno", 
                            "Naranja Mango", "Pera", "Pomelo Rosado"
                        ];
                        setSaboresActivos(listaPorDefecto.sort((a,b) => a.localeCompare(b)));
                    }
                });

                return () => { unsubSuc(); unsubStock(); unsubConfig(); };
            }, [sucursal, mesSeleccionado, appIniciada]);

            const db = window.firebaseDB;
            const gondolaData = datosStock.gondola || {};
            const depositoData = datosStock.deposito || {};

            const agregarSucursalDB = async () => {
                if (!nuevaSucursal.trim() || listaSucursales.includes(nuevaSucursal.trim())) return;
                const nuevaLista = [...listaSucursales, nuevaSucursal.trim()];
                setListaSucursales(nuevaLista);
                if (db) {
                    const sucursalesRef = doc(db, 'artifacts', appId, 'public', 'config_sucursales');
                    await setDoc(sucursalesRef, { lista: nuevaLista });
                }
                setNuevaSucursal('');
                setAgregandoSucursal(false);
            };

            const guardarSaboresEnBD = async (nuevaLista) => {
                const listaOrdenada = nuevaLista.sort((a,b) => a.localeCompare(b));
                setSaboresActivos(listaOrdenada);
                if (!db) return;
                const configRef = doc(db, 'artifacts', appId, 'public', `config_sabores`);
                await setDoc(configRef, { lista: listaOrdenada });
            };

            const agregarSaborManual = () => {
                if (!nuevoSabor.trim() || saboresActivos.includes(nuevoSabor.trim())) return;
                guardarSaboresEnBD([...saboresActivos, nuevoSabor.trim()]);
                setNuevoSabor('');
            };

            const eliminarSaborManual = (saborBorrar) => {
                guardarSaboresEnBD(saboresActivos.filter(s => s !== saborBorrar));
            };

            const guardarEdicionNombreSabor = async () => {
                if (!nombreEditado.trim() || nombreEditado === editandoSaborInfo) {
                    setEditandoSaborInfo(null);
                    return;
                }
                
                const nuevaLista = saboresActivos.map(s => s === editandoSaborInfo ? nombreEditado.trim() : s);
                guardarSaboresEnBD(nuevaLista);

                if (db) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', sucursal, mesSeleccionado);
                    const stockGondolaAntiguo = gondolaData[editandoSaborInfo] || {grandes: 0, chicas: 0};
                    const stockDepositoAntiguo = depositoData[editandoSaborInfo] || {grandes: 0};
                    
                    const nuevoDoc = JSON.parse(JSON.stringify(datosStock)); 
                    if (!nuevoDoc.gondola) nuevoDoc.gondola = {};
                    if (!nuevoDoc.deposito) nuevoDoc.deposito = {};
                    
                    delete nuevoDoc.gondola[editandoSaborInfo];
                    delete nuevoDoc.deposito[editandoSaborInfo];
                    
                    nuevoDoc.gondola[nombreEditado.trim()] = stockGondolaAntiguo;
                    nuevoDoc.deposito[nombreEditado.trim()] = stockDepositoAntiguo;
                    
                    await setDoc(docRef, nuevoDoc);
                }
                setEditandoSaborInfo(null);
            };

            const iniciarEdicionStock = (sabor) => {
                const g = gondolaData[sabor] || { grandes: 0, chicas: 0 };
                const d = depositoData[sabor] || { grandes: 0 };
                
                setValGondola({ 
                    grandes: g.grandes?.toString() || "", 
                    chicas: g.chicas?.toString() || "" 
                }); 
                setValDeposito({ 
                    grandes: d.grandes?.toString() || "" 
                }); 
                setEditandoStock(sabor);
            };

            const guardarEdicionStock = async (sabor) => {
                if (!db) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', sucursal, mesSeleccionado);
                
                let valGG = valGondola.grandes === "" ? 0 : parseInt(valGondola.grandes);
                let valGC = valGondola.chicas === "" ? 0 : parseInt(valGondola.chicas);
                let valDG = valDeposito.grandes === "" ? 0 : parseInt(valDeposito.grandes);

                if (isNaN(valGG)) valGG = 0;
                if (isNaN(valGC)) valGC = 0;
                if (isNaN(valDG)) valDG = 0;

                const nuevoDocumento = {
                    ...datosStock,
                    gondola: { ...gondolaData, [sabor]: { grandes: valGG, chicas: valGC } },
                    deposito: { ...depositoData, [sabor]: { grandes: valDG } }
                };

                await setDoc(docRef, nuevoDocumento);
                setEditandoStock(null);
            };

            const renderInicio = () => {
                const saboresAMostrar = saboresActivos.filter(sabor => {
                    if (sucursal === 'Diarco' && sabor.includes('1+1')) return false;
                    return true;
                });

                return (
                    <div className="p-4 space-y-4 pb-28 animate-fade-in">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black text-gray-800">Resumen General</h2>
                            <button onClick={() => setMostrarAjustes(true)} className="p-2 bg-gray-200 rounded-full hover:bg-gray-300">
                                <Settings size={20} className="text-gray-700"/>
                            </button>
                        </div>

                        {saboresAMostrar.length === 0 ? (
                            <p className="text-center text-gray-400 mt-10 font-medium">No hay sabores configurados.</p>
                        ) : (
                            saboresAMostrar.map(sabor => {
                                const g = gondolaData[sabor] || { grandes: 0, chicas: 0 };
                                const d = depositoData[sabor] || { grandes: 0 };

                                if (editandoStock === sabor) {
                                    return (
                                        <div key={sabor} className="bg-white p-4 rounded-2xl shadow-sm border-2 border-orange-500 mb-4">
                                            <div className="flex justify-between items-center mb-3 border-b pb-2">
                                                <h3 className="font-bold text-gray-800 text-lg">{sabor} <span className="text-orange-500 text-sm ml-2">(Editando)</span></h3>
                                                <button onClick={() => setEditandoStock(null)} className="text-gray-400 hover:text-red-500"><X size={20}/></button>
                                            </div>
                                            
                                            <div className="space-y-3 mb-4">
                                                <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                                    <span className="font-bold text-blue-700 block mb-2">📍 Góndola</span>
                                                    <div className="flex gap-2">
                                                        <div className="flex-1">
                                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Grandes (G)</label>
                                                            <input type="number" value={valGondola.grandes} onChange={e => setValGondola({...valGondola, grandes: e.target.value})} className="w-full p-2 text-center font-bold border-2 border-white rounded-lg outline-none" placeholder="0" />
                                                        </div>
                                                        <div className="flex-1">
                                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Chicas (C)</label>
                                                            <input type="number" value={valGondola.chicas} onChange={e => setValGondola({...valGondola, chicas: e.target.value})} className="w-full p-2 text-center font-bold border-2 border-white rounded-lg outline-none" placeholder="0" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="bg-purple-50 p-3 rounded-xl border border-purple-100">
                                                    <span className="font-bold text-purple-700 block mb-2">📦 Depósito</span>
                                                    <div className="flex gap-2">
                                                        <div className="flex-1">
                                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Grandes (G)</label>
                                                            <input type="number" value={valDeposito.grandes} onChange={e => setValDeposito({...valDeposito, grandes: e.target.value})} className="w-full p-2 text-center font-bold border-2 border-white rounded-lg outline-none" placeholder="0" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <button onClick={() => guardarEdicionStock(sabor)} className="w-full bg-orange-500 text-white font-bold p-3 rounded-xl shadow-md flex justify-center items-center gap-2">
                                                <Save size={18} /> Guardar Cambios
                                            </button>
                                        </div>
                                    );
                                }

                                return (
                                    <div key={sabor} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="font-black text-gray-800 text-xl">{sabor}</h3>
                                            <button onClick={() => iniciarEdicionStock(sabor)} className="bg-blue-100 text-blue-600 p-2 rounded-lg hover:bg-blue-200">
                                                <Edit2 size={16} />
                                            </button>
                                        </div>
                                        
                                        <div className="flex gap-3">
                                            <div className="flex-1 bg-blue-50/50 rounded-xl p-3 border border-blue-100 flex flex-col justify-center items-center text-center">
                                                <span className="text-xs font-bold text-blue-800 uppercase flex items-center gap-1 mb-1">📍 Góndola</span>
                                                <div className="font-black text-blue-900 text-[1.1rem]">
                                                    {parseInt(g.grandes) || 0}G - {parseInt(g.chicas) || 0}C
                                                </div>
                                            </div>
                                            <div className="flex-1 bg-purple-50/50 rounded-xl p-3 border border-purple-100 flex flex-col justify-center items-center text-center">
                                                <span className="text-xs font-bold text-purple-800 uppercase flex items-center gap-1 mb-1">📦 Depósito</span>
                                                <div className="font-black text-purple-900 text-[1.1rem]">
                                                    {parseInt(d.grandes) || 0}G
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                );
            };

            const renderCargar = () => {
                const modoAgregar = tabActual === 'agregar';

                const guardarStock = async () => {
                    if (!saborSeleccionado) return;
                    
                    let inputG_g = parseInt(cantGondola.grandes) || 0;
                    let inputG_c = parseInt(cantGondola.chicas) || 0;
                    let inputD_g = parseInt(cantDeposito.grandes) || 0;

                    if (!modoAgregar) {
                        inputG_g = -Math.abs(inputG_g);
                        inputG_c = -Math.abs(inputG_c);
                        inputD_g = -Math.abs(inputD_g);
                    }

                    const currentG_g = parseInt(gondolaData[saborSeleccionado]?.grandes) || 0;
                    const currentG_c = parseInt(gondolaData[saborSeleccionado]?.chicas) || 0;
                    const currentD_g = parseInt(depositoData[saborSeleccionado]?.grandes) || 0;

                    let newG_g = currentG_g + inputG_g;
                    let newG_c = currentG_c + inputG_c;
                    let newD_g = currentD_g + inputD_g;

                    if (newG_c < 0) {
                        const cajasGrandesNecesarias = Math.ceil(Math.abs(newG_c) / 24);
                        newG_g -= cajasGrandesNecesarias;
                        newG_c += (cajasGrandesNecesarias * 24);
                    }

                    if (newG_g < 0) newG_g = 0;
                    if (newG_c < 0) newG_c = 0;
                    if (newD_g < 0) newD_g = 0;

                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', sucursal, mesSeleccionado);
                    const nuevoDocumento = {
                        ...datosStock,
                        gondola: { ...gondolaData, [saborSeleccionado]: { grandes: newG_g, chicas: newG_c } },
                        deposito: { ...depositoData, [saborSeleccionado]: { grandes: newD_g } }
                    };

                    await setDoc(docRef, nuevoDocumento);
                    setSaborSeleccionado('');
                    setCantGondola({ grandes: '', chicas: '' });
                    setCantDeposito({ grandes: '' });
                    setTabActual('inicio');
                };

                return (
                    <div className="p-4 pb-28 animate-fade-in">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-xl font-black text-gray-800 mb-6 flex items-center gap-2">
                                {modoAgregar ? <><PlusCircle className="text-green-500"/> Agregar Stock</> : <><MinusCircle className="text-red-500"/> Restar Stock</>}
                            </h2>

                            <label className="block text-sm font-bold text-gray-700 mb-2">Sabor</label>
                            <select 
                                value={saborSeleccionado} 
                                onChange={e => setSaborSeleccionado(e.target.value)}
                                className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl mb-4 font-semibold text-gray-800 outline-none"
                            >
                                <option value="">Selecciona un sabor...</option>
                                {saboresActivos
                                    .filter(s => !(sucursal === 'Diarco' && s.includes('1+1')))
                                    .map(s => <option key={s} value={s}>{s}</option>)
                                }
                            </select>

                            {saborSeleccionado && (
                                <div className="bg-orange-50 border border-orange-100 p-3 rounded-xl mb-6">
                                    <div className="text-xs font-bold text-orange-600 uppercase mb-1 flex items-center gap-1"><Info size={14}/> Stock actual en este mes:</div>
                                    <div className="text-sm font-semibold text-gray-700">
                                        📍 Góndola: {parseInt(gondolaData[saborSeleccionado]?.grandes) || 0}G - {parseInt(gondolaData[saborSeleccionado]?.chicas) || 0}C
                                        <br/>
                                        📦 Depósito: {parseInt(depositoData[saborSeleccionado]?.grandes) || 0}G
                                    </div>
                                </div>
                            )}

                            <label className="block text-sm font-bold text-gray-700 mb-2">Ubicación</label>
                            <div className="flex gap-2 mb-6">
                                <button onClick={() => setUbicacionSel('gondola')} className={`flex-1 p-3 rounded-xl font-bold flex justify-center items-center gap-2 transition-all ${ubicacionSel === 'gondola' ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-100 text-gray-500'}`}>
                                    📍 Góndola
                                </button>
                                <button onClick={() => setUbicacionSel('deposito')} className={`flex-1 p-3 rounded-xl font-bold flex justify-center items-center gap-2 transition-all ${ubicacionSel === 'deposito' ? 'bg-purple-600 text-white shadow-md' : 'bg-gray-100 text-gray-500'}`}>
                                    📦 Depósito
                                </button>
                            </div>

                            <label className="block text-sm font-bold text-gray-700 mb-2">Cajas Grandes (G)</label>
                            <input 
                                type="number" 
                                placeholder={modoAgregar ? "Ej. 1 (o -1 para restar)" : "Ej. 1"}
                                value={ubicacionSel === 'gondola' ? cantGondola.grandes : cantDeposito.grandes}
                                onChange={e => ubicacionSel === 'gondola' ? setCantGondola({...cantGondola, grandes: e.target.value}) : setCantDeposito({...cantDeposito, grandes: e.target.value})}
                                className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl mb-4 text-center font-black text-xl outline-none"
                            />

                            {ubicacionSel === 'gondola' && (
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Cajas Chicas (C)</label>
                                    <input 
                                        type="number" 
                                        placeholder={modoAgregar ? "Ej. 2 (o -2 para restar)" : "Ej. 2"}
                                        value={cantGondola.chicas}
                                        onChange={e => setCantGondola({...cantGondola, chicas: e.target.value})}
                                        className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl mb-6 text-center font-black text-xl outline-none"
                                    />
                                </div>
                            )}

                            <button 
                                onClick={guardarStock}
                                disabled={!saborSeleccionado}
                                className={`w-full p-4 rounded-xl font-black text-white text-lg shadow-md transition-transform active:scale-95 flex justify-center items-center gap-2 ${!saborSeleccionado ? 'bg-gray-300' : (modoAgregar ? 'bg-green-500' : 'bg-red-500')}`}
                            >
                                <Save size={24} /> {modoAgregar ? 'Guardar Ingreso' : 'Descontar Stock'}
                            </button>
                        </div>
                    </div>
                );
            };

            const renderTotales = () => {
                const saboresAMostrar = saboresActivos.filter(s => !(sucursal === 'Diarco' && s.includes('1+1')));
                let granTotal = 0;

                return (
                    <div className="p-4 pb-28 animate-fade-in">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-xl font-black text-gray-800 mb-2 flex items-center gap-2 border-b pb-4">
                                <BarChart3 className="text-blue-500"/> Totales del Mes ({formatearMes(mesSeleccionado)})
                            </h2>
                            <div className="mt-4 space-y-1">
                                {saboresAMostrar.length === 0 ? (
                                    <p className="text-gray-400 text-center py-4">No hay datos configurados.</p>
                                ) : (
                                    saboresAMostrar.map(sabor => {
                                        const g = gondolaData[sabor] || {};
                                        const d = depositoData[sabor] || {};
                                        const g_grandes = parseInt(g.grandes) || 0;
                                        const g_chicas = parseInt(g.chicas) || 0;
                                        const d_grandes = parseInt(d.grandes) || 0;
                                        
                                        const total = (g_grandes * 240) + (g_chicas * 10) + (d_grandes * 240);
                                        granTotal += total;

                                        return (
                                            <div key={sabor} className="border-b border-dashed border-gray-200 py-2">
                                                <span className="font-bold text-gray-800 text-lg block">
                                                    {sabor}: &nbsp;&nbsp;&nbsp; <span className="font-black text-orange-600 text-xl">{total} un.</span>
                                                </span>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                            <div className="mt-6 pt-4 border-t-4 border-gray-800">
                                <h3 className="font-black text-gray-800 text-xl text-right uppercase">
                                    Gran Total: <span className="text-3xl text-orange-600">{granTotal} un.</span>
                                </h3>
                            </div>
                        </div>
                    </div>
                );
            };

            if (!isFirebaseReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 animate-fade-in">
                        <div className="text-center">
                            <div className="w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <h2 className="text-lg font-bold text-gray-700">Conectando...</h2>
                        </div>
                    </div>
                );
            }

            // PANTALLA INICIAL DE SELECCIÓN DE SUCURSAL
            if (!appIniciada) {
                return (
                    <div className="min-h-screen bg-orange-500 flex flex-col items-center justify-center p-6 animate-fade-in text-white overflow-y-auto">
                        <Store size={72} className="mb-6 opacity-90" strokeWidth={1.5} />
                        <h1 className="text-4xl font-black text-center tracking-tight mb-2">Stock Rinde Dos</h1>
                        <p className="text-orange-100 text-lg text-center mb-10 font-medium">¿En qué sucursal vas a cargar hoy?</p>
                        
                        <div className="w-full max-w-sm space-y-4 mb-8">
                            {listaSucursales.map(suc => (
                                <button 
                                    key={suc}
                                    onClick={() => { setSucursal(suc); setAppIniciada(true); }} 
                                    className="w-full bg-white text-orange-600 font-black text-2xl p-5 rounded-2xl shadow-xl hover:scale-105 transition-transform flex items-center justify-center gap-3 border-b-4 border-orange-200"
                                >
                                    <Store size={28} /> {suc}
                                </button>
                            ))}

                            {agregandoSucursal ? (
                                <div className="bg-white/20 p-4 rounded-2xl border border-white/40 animate-fade-in flex flex-col gap-3">
                                    <input 
                                        type="text" 
                                        autoFocus
                                        placeholder="Nombre (Ej. Yaguar)" 
                                        value={nuevaSucursal}
                                        onChange={e => setNuevaSucursal(e.target.value)}
                                        className="w-full p-3 rounded-xl text-gray-800 font-bold outline-none"
                                    />
                                    <div className="flex gap-2">
                                        <button onClick={agregarSucursalDB} className="flex-1 bg-green-500 text-white font-bold p-3 rounded-xl shadow-md">Guardar</button>
                                        <button onClick={() => setAgregandoSucursal(false)} className="bg-red-400 text-white font-bold p-3 rounded-xl shadow-md"><X size={20}/></button>
                                    </div>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setAgregandoSucursal(true)} 
                                    className="w-full bg-orange-600 text-white font-bold text-lg p-4 rounded-2xl shadow-md hover:bg-orange-700 transition-colors flex items-center justify-center gap-2 border border-orange-400"
                                >
                                    <Plus size={20} /> Añadir nueva sucursal
                                </button>
                            )}
                        </div>
                        <div className="text-sm text-orange-200 font-medium opacity-80">
                            Registro Mensual Continuo
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative max-w-md mx-auto bg-gray-50 shadow-xl overflow-x-hidden">
                    {/* Header Fijo */}
                    <div className="bg-orange-500 pt-12 pb-6 px-6 rounded-b-[2rem] shadow-lg relative z-10">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-3 text-white">
                                <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-white/20 rounded-lg transition-colors">
                                    <Menu size={32} />
                                </button>
                                <div>
                                    <h1 className="text-2xl font-black leading-none tracking-tight">Stock Rinde Dos</h1>
                                    <p className="text-orange-100 text-sm font-medium capitalize">Mes: {formatearMes(mesSeleccionado)}</p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white/20 p-1.5 rounded-xl flex items-center mt-2">
                            <Store className="text-white ml-2" size={20}/>
                            <select 
                                value={sucursal} 
                                onChange={(e) => setSucursal(e.target.value)}
                                className="bg-transparent text-white font-bold w-full p-2 outline-none appearance-none cursor-pointer"
                            >
                                {listaSucursales.map(suc => (
                                    <option key={suc} value={suc} className="text-gray-800">{suc}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* Banner de aviso si estás en el pasado */}
                    {mesSeleccionado !== mesSistemaReal && (
                        <div className="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-3 mx-4 mt-4 rounded shadow-sm text-sm font-bold flex items-center gap-2 animate-fade-in">
                            <AlertTriangle size={18} />
                            Estás viendo el historial de {formatearMes(mesSeleccionado)}.
                        </div>
                    )}

                    <div className="relative z-0">
                        {tabActual === 'inicio' && renderInicio()}
                        {tabActual === 'agregar' && renderCargar()}
                        {tabActual === 'restar' && renderCargar()}
                        {tabActual === 'totales' && renderTotales()}
                    </div>

                    {/* Navbar inferior */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 pb-6 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] z-40 max-w-md mx-auto">
                        <button onClick={() => setTabActual('inicio')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${tabActual === 'inicio' ? 'text-orange-600 scale-110' : 'text-gray-400 hover:text-gray-600'}`}>
                            <Home size={24} strokeWidth={tabActual==='inicio'?3:2} />
                            <span className="text-[10px] font-bold mt-1">Inicio</span>
                        </button>
                        <button onClick={() => setTabActual('agregar')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${tabActual === 'agregar' ? 'text-green-500 scale-110' : 'text-gray-400 hover:text-gray-600'}`}>
                            <PlusCircle size={24} strokeWidth={tabActual==='agregar'?3:2} />
                            <span className="text-[10px] font-bold mt-1">Agregar</span>
                        </button>
                        <button onClick={() => setTabActual('restar')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${tabActual === 'restar' ? 'text-red-500 scale-110' : 'text-gray-400 hover:text-gray-600'}`}>
                            <MinusCircle size={24} strokeWidth={tabActual==='restar'?3:2} />
                            <span className="text-[10px] font-bold mt-1">Restar</span>
                        </button>
                        <button onClick={() => setTabActual('totales')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${tabActual === 'totales' ? 'text-blue-500 scale-110' : 'text-gray-400 hover:text-gray-600'}`}>
                            <BarChart3 size={24} strokeWidth={tabActual==='totales'?3:2} />
                            <span className="text-[10px] font-bold mt-1">Totales</span>
                        </button>
                    </div>

                    {/* Menú Lateral (Historial de Meses) */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex animate-fade-in">
                            <div className="bg-white w-3/4 max-w-sm h-full shadow-2xl flex flex-col transform transition-transform animate-slide-right">
                                <div className="bg-orange-600 p-6 pt-12 flex flex-col gap-2">
                                    <h2 className="text-white text-3xl font-black">Historial</h2>
                                    <p className="text-orange-200 font-bold">{sucursal}</p>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50">
                                    <h3 className="text-gray-500 font-bold text-xs uppercase mb-4 ml-2">Seleccionar Mes</h3>
                                    {generarMeses().map(m => (
                                        <button 
                                            key={m} 
                                            onClick={() => { setMesSeleccionado(m); setIsMenuOpen(false); }}
                                            className={`w-full text-left p-4 rounded-xl font-bold capitalize transition-all shadow-sm ${mesSeleccionado === m ? 'bg-orange-100 text-orange-600 border-2 border-orange-500' : 'bg-white text-gray-700 hover:bg-gray-100 border-2 border-transparent'}`}
                                        >
                                            {formatearMes(m)}
                                        </button>
                                    ))}
                                </div>
                                <div className="p-4 border-t bg-white">
                                    <button onClick={() => setIsMenuOpen(false)} className="w-full bg-gray-200 text-gray-800 font-bold p-4 rounded-xl">Cerrar Menú</button>
                                </div>
                            </div>
                            <div className="flex-1" onClick={() => setIsMenuOpen(false)}></div>
                        </div>
                    )}

                    {/* Menú de Ajustes de Sabores */}
                    {mostrarAjustes && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="bg-gray-100 p-4 border-b flex justify-between items-center">
                                    <h3 className="font-bold text-gray-800 text-lg flex items-center gap-2">
                                        <Settings size={20} className="text-gray-600"/> Ajustes de Sabores
                                    </h3>
                                    <button onClick={() => setMostrarAjustes(false)} className="text-gray-500 hover:text-red-500"><X size={24} /></button>
                                </div>
                                <div className="p-5 overflow-y-auto">
                                    <div className="mb-6 border-b pb-4">
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Nuevo sabor a la lista</label>
                                        <div className="flex gap-2">
                                            <input type="text" value={nuevoSabor} onChange={e => setNuevoSabor(e.target.value)} placeholder="Ej. Uva Mágica" className="flex-1 p-2 bg-gray-50 border border-gray-200 rounded-lg outline-none"/>
                                            <button onClick={agregarSaborManual} className="bg-orange-500 text-white px-3 py-2 rounded-lg font-bold flex items-center"><Plus size={18}/></button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-3">Lista Actual General</label>
                                        <div className="space-y-2">
                                            {saboresActivos.map(s => (
                                                <div key={s} className="flex items-center gap-2 bg-gray-50 border border-gray-200 p-2 rounded-lg">
                                                    {editandoSaborInfo === s ? (
                                                        <div className="flex flex-1 gap-2">
                                                            <input type="text" autoFocus value={nombreEditado} onChange={e => setNombreEditado(e.target.value)} className="flex-1 p-1 text-sm font-bold border rounded outline-none"/>
                                                            <button onClick={guardarEdicionNombreSabor} className="bg-green-500 text-white p-1.5 rounded"><Save size={14}/></button>
                                                            <button onClick={() => setEditandoSaborInfo(null)} className="bg-gray-300 text-gray-700 p-1.5 rounded"><X size={14}/></button>
                                                        </div>
                                                    ) : (
                                                        <>
                                                            <span className="flex-1 font-semibold text-sm text-gray-800 pl-2">{s}</span>
                                                            <button onClick={() => { setEditandoSaborInfo(s); setNombreEditado(s); }} className="text-blue-500 p-1 bg-blue-50 rounded hover:bg-blue-100"><Edit2 size={14}/></button>
                                                            <button onClick={() => eliminarSaborManual(s)} className="text-red-500 p-1 bg-red-50 rounded hover:bg-red-100"><Trash2 size={14}/></button>
                                                        </>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .animate-slide-right { animation: slideRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</body>
</html>
